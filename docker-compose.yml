version: '3.9'

# Los secrets JWT se leen del archivo ./backend/.env (no versionado).
# Copia backend/.env.example a backend/.env y rellena los valores antes de ejecutar.

services:
  # ── Backend ─────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      target: builder        # stage con devDependencies para desarrollo
    container_name: taskflow-backend
    restart: unless-stopped
    ports:
      - "3001:3001"
    env_file:
      - ./backend/.env       # contiene JWT_SECRET, JWT_REFRESH_SECRET y demás vars
    environment:
      # Sobreescribimos solo lo que cambia en el contexto docker
      NODE_ENV: development
      PORT: 3001
      DYNAMODB_ENDPOINT: http://dynamodb-local:8000
      CORS_ORIGINS: http://localhost:5173
      FRONTEND_URL: http://localhost:5173
    command: npx ts-node src/app.ts
    volumes:
      - ./backend/src:/app/src:ro
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - taskflow-net

  # ── DynamoDB Local ───────────────────────────────────────
  dynamodb-local:
    image: amazon/dynamodb-local:latest
    container_name: taskflow-dynamodb
    restart: unless-stopped
    ports:
      - "8000:8000"
    command: "-jar DynamoDBLocal.jar -sharedDb -inMemory"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000 || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s
    networks:
      - taskflow-net

  # ── DynamoDB Admin UI ────────────────────────────────────
  dynamodb-admin:
    image: aaronshaf/dynamodb-admin:latest
    container_name: taskflow-dynamo-admin
    restart: unless-stopped
    ports:
      - "8001:8001"
    environment:
      DYNAMO_ENDPOINT: http://dynamodb-local:8000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: local
      AWS_SECRET_ACCESS_KEY: local
    depends_on:
      dynamodb-local:
        condition: service_healthy
    networks:
      - taskflow-net

networks:
  taskflow-net:
    driver: bridge
